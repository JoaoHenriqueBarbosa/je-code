[workspace]
resolver = "3"
members = ["crates/*", "testbench/*"]
# ref/ (pseudo-linus, oráculo) fica fora do workspace: as crates dele herdam do workspace do próprio pseudo-linus.
exclude = ["ref"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1

[profile.dev]
panic = "unwind"

[patch.crates-io]
ferroni = { path = "vendor/ferroni" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }

# O zjsc tem cerca de 635 mil linhas numa crate só: sem debuginfo para o link e a memória caberem.
[profile.release.package.zjsc]
debug = 0

# O ferroni em debug estoura o limite de 500 ms por linha do tokenizeLine2 (1 das 109 fixtures); o
# restante do workspace continua em debug.
[profile.dev.package.ferroni]
opt-level = 3
