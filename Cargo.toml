[workspace]
resolver = "3"
members = ["crates/*", "testbench/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1

[profile.dev]
panic = "unwind"

[patch.crates-io]
ferroni = { path = "vendor/ferroni" }
