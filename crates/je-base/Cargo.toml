[package]
name = "je-base"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Porte de vs/base/common do VS Code: utilitários sem UI."

[lints]
workspace = true

# `Intl.Collator` (colação CLDR, mesma crate e mesma versão do `zjsc` do pseudo-linus, vendorizada) e a
# normalização NFC/NFD de `String.prototype.normalize`. As duas ficam em `~2.3.0` para dividir os dados
# compilados do ICU4X com o `icu_collator` vendorizado, ver `vendor/icu_collator/JE-CODE.md`.
[dependencies]
icu_collator = { path = "../../vendor/icu_collator" }
icu_locale_core = "2"
icu_normalizer = "~2.3.0"
# Fuso local do `Date` (`fromNowByDay`, `toLocalISOString`): o fuso do sistema (`TZ`, `/etc/localtime`) e o banco
# de fusos embutido para onde o sistema não tem um (Windows, web). Mesmo `jiff` que o `zjsc` do pseudo-linus usa.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
# `RegExp` ECMAScript do `glob`: o glob do VS Code compila cada padrão para uma regex.
zyarr = { path = "../zyarr" }
# `product.json` (`IProductConfiguration`) e os dados de política e de conta: leitura e escrita sem perda, com as chaves
# desconhecidas preservadas. `preserve_order` mantém a ordem das chaves do arquivo.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
# SHA-256 do `createStaticIPCHandle` e do `checksum` (RustCrypto, Rust puro).
sha2 = "0.10"

# Fonte de aleatoriedade do SO para `Math.random` e `crypto.randomUUID`. No alvo web
# (wasm32-unknown-unknown) o `random` cai num fallback do std, ver `src/random.rs`.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "0.3"
