[package]
name = "je-extensions"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Porte do gerenciamento de extensões do VS Code (vs/platform/extensions e extensionManagement): manifesto, validação, scanner, perfil, instalação de VSIX e cliente do marketplace."

[lints]
workspace = true

[dependencies]
je-base = { path = "../je-base" }
je-platform = { path = "../je-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
zyarr = { path = "../zyarr" }

# Rede e zip só fora do alvo web (o navegador não tem sistema de arquivos nem soquetes).
# ureq sem provedor de cripto embutido (o padrão dele puxa o `ring`): o provedor é o RustCrypto, em Rust puro.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
rustls-rustcrypto = "0.0.2-alpha"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
