[package]
name = "je-theme"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Temas de cor do VS Code: leitura de color themes (com include) e as cores do workbench."

[dependencies]
je-base = { path = "../je-base" }
je-render = { path = "../je-render" }
# `IJSONSchema` do `tokenStylingSchema` como `serde_json::Value`, a mesma representação do `je-workbench`.
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
