[package]
name = "je-editor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Porte de vs/editor/common do VS Code: o núcleo do editor (posições, intervalos, piece tree do buffer de texto)."

[lints]
workspace = true

[dependencies]
je-base = { path = "../je-base" }
# `Color`, `Srgba` e `Hsla` do `color.ts` (cores padrão do documento).
je-theme = { path = "../je-theme" }
# `RegExp` ECMAScript da busca no buffer (`findMatchesLineByLine`).
zyarr = { path = "../zyarr" }
# Contratos de plataforma: `IConfigurationService` e os valores de configuração
# (`textResourceConfigurationService`), `platform/opener` e `platform/commands` (`OpenerService`).
je-platform = { path = "../je-platform" }
je-extensions = { path = "../je-extensions" }
# Os identificadores de serviço e o `Injectable` (`createDecorator` e os parâmetros `@IFoo`).
je-instantiation = { path = "../je-instantiation" }
# A árvore de widgets nativa e o `Sash`: o `DiffEditorSash` do editor de diff cria o sash dentro de um nó dela.
je-ui = { path = "../je-ui" }
je-widgets = { path = "../je-widgets" }
# O `Rect` (kurbo) dos limites dos nós de `je-ui`: o `ZoneWidget` posiciona o nó dele e o do cabeçalho do peek.
je-render = { path = "../je-render" }
# O `new Date()` (fuso do sistema) do `TimeBasedVariableResolver` dos snippets: o mesmo `jiff` do `je-base`.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

[dev-dependencies]
# O `InMemoryTextModelService` do `standaloneServices.test.ts` mora no `je-workbench` (o `ITextEditorModel` que ele devolve
# depende do `IEditorModel` do workbench). O `je-workbench` depende do `je-editor`, e uma dependência de desenvolvimento
# circular é aceita pelo Cargo (só os testes de integração a usam, como o `je-exthost` no `je-workbench`).
je-workbench = { path = "../je-workbench" }

[[bench]]
name = "piece_tree"
harness = false

[[bench]]
name = "text_model_decorations"
harness = false

[[bench]]
name = "bracket_pairs_tree"
harness = false
