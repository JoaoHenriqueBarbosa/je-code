[package]
name = "je-languages"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Linguagens do editor: as contribuições das extensões embutidas, a tokenização TextMate ligada ao registro de tokenização do editor e o carregamento das configurações de linguagem."

[lints]
workspace = true

[dependencies]
je-base = { path = "../je-base" }
je-editor = { path = "../je-editor" }
# `ThemeType`, `normalizeColor` e os padrões de tema, definidos uma vez (já é dependência transitiva via `je-editor`).
je-theme = { path = "../je-theme" }
# Porte do `vscode-textmate` sobre o `ferroni` (Oniguruma em Rust puro), H14 do `docs/bench-report.md`.
ferriki-textmate = "=1.1.2"
# Só a ponte para o `RawTheme` do ferriki, que deserializa de `serde_json::Value`.
serde_json = "1"

[[bench]]
name = "tokenization"
harness = false
