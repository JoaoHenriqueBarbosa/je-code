[package]
name = "je-workbench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Porte de vs/workbench do VS Code: serviços e contribuições do workbench."

[lints]
workspace = true

[dependencies]
je-base = { path = "../je-base" }
je-platform = { path = "../je-platform" }
# `IStorageService` guarda `StorageValue` (o modelo da barra de status grava a lista de entradas escondidas).
je-storage = { path = "../je-storage" }
# O manifesto de extensão (`IExtensionManifest`), `ExtensionIdentifier.toKey` e os identificadores de
# extensão que o `extensionManifestPropertiesService` lê (je-extensions não depende do je-workbench).
je-extensions = { path = "../je-extensions" }
# O JSON do manifesto (`capabilities`, `contributes`) e os literais dos testes.
serde_json = { version = "1", features = ["preserve_order"] }
# Tipos do editor (`Position`, `Range`, `TextLength`) que o workbench usa, como no original.
je-editor = { path = "../je-editor" }
# Injeção de dependência (`IInstantiationService`, `registerSingleton`) dos serviços do workbench.
je-instantiation = { path = "../je-instantiation" }
# `Color.Format.CSS.parseHex` da validação de settings (`format: color-hex`).
je-theme = { path = "../je-theme" }
# `RegExp` ECMAScript do `terminalLinkParsing` e do padrão de busca do usuário (`ReplacePattern`).
zyarr = { path = "../zyarr" }
# `Date.parse` e `toLocaleDateString` de `updateUtils` (mesmo `jiff` do je-base, fuso do sistema).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
# `Direction` e `IViewSize` do grid (`base/browser/ui/grid`) que o `IWorkbenchLayoutService` usa.
je-widgets = { path = "../je-widgets" }
# O nó (`NodeId`) e a árvore (`Ui`) em que o `EditorPart` e o `EditorGroupView` se apoiam para o grid e o layout centralizado.
je-ui = { path = "../je-ui" }
# Cor, retângulo e estilo de texto (`Rgba`, `kurbo::Rect`, `TextStyle`) dos renderers nativos do workbench, como o das notificações.
je-render = { path = "../je-render" }
# A medição de texto dos renderers nativos (a quebra da mensagem da notificação) e o medidor de caractere do terminal: o
# mesmo sistema de texto nativo que desenha a UI, no lugar do `getBoundingClientRect` do DOM.
je-text = { path = "../je-text" }
# `new URL(...)` (WHATWG) do `UrlFinder`: valida cada trecho que parece uma URL de servidor local.
url = "2"

# `textfile/encoding`: o `iconv-lite` (codificações WHATWG) do original, em Rust puro, e o `jschardet`
# (detecção), a crate do workspace que porta o 3.1.4.
encoding_rs = "0.8"
jschardet = { path = "../jschardet" }
# Mapa com ordem de inserção, para os objetos JS iterados em ordem (`accountPolicyService`).
indexmap = "2"

# Os auxiliares de teste de `je-platform/tests/common` (incluídos por `#[path]` em `tests/configuration_service.rs`)
# usam `indexmap` (já nas dependências) e `tempfile`.
[dev-dependencies]
tempfile = "3"
# O `crypto.createHash('sha256')` do `workspaceTags.test.ts` (o mesmo `sha2` do je-base).
sha2 = "0.10"
# O host de extensões real (zjsc rodando o código das extensões) para o teste de integração `extension_host_manager`; o `je-exthost`
# depende do `je-workbench`, e uma dependência de desenvolvimento circular é aceita pelo Cargo (só os testes de integração a usam).
je-exthost = { path = "../je-exthost" }
