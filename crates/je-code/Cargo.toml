[package]
name = "je-code"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "O executável do je-code."

[lib]
name = "je_code"
path = "src/lib.rs"

[[bin]]
name = "je-code"
path = "src/main.rs"

[dependencies]
je-base = { path = "../je-base" }
je-editor = { path = "../je-editor" }
je-editor-view = { path = "../je-editor-view" }
je-extensions = { path = "../je-extensions" }
je-platform = { path = "../je-platform" }
je-render = { path = "../je-render" }
je-terminal = { path = "../je-terminal" }
je-theme = { path = "../je-theme" }
je-ui = { path = "../je-ui" }
je-widgets = { path = "../je-widgets" }
serde_json = "1"
# Mover para a lixeira do sistema (a confirmação "Move to Trash" do explorador).
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
je-text = { path = "../je-text" }
# `Instant` que também funciona no wasm (o winit usa o mesmo tipo no `ControlFlow::WaitUntil`).
web-time = "1"
png = "0.18"
winit = "0.30"

[lints]
workspace = true
