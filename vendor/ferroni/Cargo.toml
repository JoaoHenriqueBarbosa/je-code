[package]
edition = "2024"
rust-version = "1.94"
name = "ferroni"
version = "2.5.2"
authors = ["Sebastian Software GmbH"]
build = "build.rs"
exclude = [
    ".cache/",
    ".cargo/",
    "benches/",
    "docs/",
    "fuzz/",
    "scripts/",
    "examples/backtrack_rewrite_census.rs",
    "examples/prefilter_census.rs",
    "examples/profile_cpp_scanner.rs",
    "examples/profile_scanner_patterns.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Oniguruma's regex engine in pure Rust: full Oniguruma syntax, a vscode-oniguruma-compatible TextMate scanner, no C toolchain"
homepage = "https://ferroni.dev/"
documentation = "https://docs.rs/ferroni"
readme = "README.md"
keywords = [
    "regex",
    "oniguruma",
    "textmate",
    "syntax-highlighting",
    "ferramenta",
]
categories = [
    "text-processing",
    "parsing",
    "text-editors",
]
license = "BSD-2-Clause"
repository = "https://github.com/sebastian-software/ferroni"

[package.metadata.docs.rs]
all-features = false
features = ["precompiled"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = ["dfa-prefilter"]
dfa-prefilter = [
    "dep:regex-automata",
    "dep:regex-syntax",
]
ffi = ["cc"]
