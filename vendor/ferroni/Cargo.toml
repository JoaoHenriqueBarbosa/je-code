[dependencies.aho-corasick]
version = "1"

[dependencies.bitflags]
version = "2"

[dependencies.memchr]
version = "2"

[dependencies.regex-automata]
version = "0.4"
features = [
    "std",
    "syntax",
    "meta",
    "nfa-thompson",
    "hybrid",
    "perf-literal",
    "perf-inline",
]
optional = true
default-features = false

[dependencies.regex-syntax]
version = "0.8"
features = ["std"]
optional = true
default-features = false

[dependencies.smallvec]
version = "1"

[dev-dependencies.fancy-regex]
version = "0.19"

[dev-dependencies.libc]
version = "0.2"

[dev-dependencies.regex]
version = "1"

[dev-dependencies.serde_json]
version = "1"

[build-dependencies.cc]
version = "1"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.criterion]
version = "0.8"
features = ["html_reports"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.pcre2-sys]
version = "0.2"

[lints.clippy]
