[package]
name = "scene-web"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Sem `multithreading`: o wasm do navegador não tem threads sem SharedArrayBuffer e rayon.
[dependencies]
parley = { version = "0.12", default-features = false, features = ["std"] }
vello = "0.11"
vello_cpu = "0.3"
wgpu = { version = "30", default-features = false, features = ["webgpu"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Performance",
    "Navigator", "console",
] }

[lints]
workspace = true
